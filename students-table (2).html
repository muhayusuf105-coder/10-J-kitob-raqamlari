<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kitob raqamlari jadvali</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg: #fff;
      --surface: #f7f6f3;
      --border: #e9e8e4;
      --text: #37352f;
      --muted: #9b9a97;
      --hover: #f1f0ed;
      --head-bg: #f7f6f3
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      padding: 32px 24px;
      min-height: 100vh
    }

    .page-icon {
      font-size: 36px;
      margin-bottom: 8px
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -.02em;
      margin-bottom: 4px
    }

    .page-meta {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 24px
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      align-items: center
    }

    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 180px;
      max-width: 280px
    }

    .search-wrap input {
      width: 100%;
      padding: 6px 10px 6px 30px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: inherit;
      font-size: 12px;
      background: var(--bg);
      color: var(--text);
      outline: none
    }

    .search-wrap input:focus {
      border-color: #a8a29e
    }

    .search-wrap svg {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted)
    }

    .btn {
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 12px;
      font-family: inherit;
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background .15s
    }

    .btn:hover {
      background: var(--hover)
    }

    .count-badge {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 12px;
      color: var(--muted);
      margin-left: auto
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 6px
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1400px
    }

    thead tr {
      background: var(--head-bg)
    }

    th {
      padding: 8px 10px;
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      white-space: nowrap;
      position: sticky;
      top: 0;
      background: var(--head-bg);
      z-index: 2
    }

    th:first-child {
      text-align: center;
      min-width: 36px;
      position: sticky;
      left: 0;
      z-index: 3;
      background: var(--head-bg)
    }

    th:nth-child(2) {
      text-align: left;
      min-width: 190px;
      position: sticky;
      left: 36px;
      z-index: 3;
      background: var(--head-bg)
    }

    th:last-child {
      border-right: none
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background .1s
    }

    tbody tr:last-child {
      border-bottom: none
    }

    tbody tr:hover {
      background: var(--hover)
    }

    td {
      padding: 7px 10px;
      text-align: center;
      border-right: 1px solid var(--border);
      font-size: 13px;
      white-space: nowrap
    }

    td:first-child {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
      position: sticky;
      left: 0;
      background: inherit;
      z-index: 1
    }

    td:nth-child(2) {
      text-align: left;
      font-weight: 500;
      position: sticky;
      left: 36px;
      background: inherit;
      z-index: 1
    }

    td:last-child {
      border-right: none
    }

    .num {
      font-variant-numeric: tabular-nums;
      color: var(--text)
    }

    .empty {
      color: #d1d5db
    }

    @media print {
      .controls {
        display: none
      }

      .table-wrap {
        border: none
      }

      th,
      td {
        font-size: 10px;
        padding: 4px 6px
      }
    }
  </style>
</head>

<body>

  <div class="page-icon">📚</div>
  <h1>Kitob raqamlari jadvali</h1>
  <p class="page-meta">O'quvchilarga berilgan darslik raqamlari · 27 o'quvchi · 18 ta fan</p>

  <div class="controls">
    <div class="search-wrap">
      <svg width="12" height="12" fill="none" viewBox="0 0 16 16">
        <circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.5" />
        <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      </svg>
      <input type="text" id="search" placeholder="O'quvchi qidirish..." />
    </div>
    <button class="btn" onclick="sortByName()">⇅ Ism bo'yicha</button>
    <button class="btn" onclick="window.print()">⎙ Chop etish</button>
    <span class="count-badge" id="count">27 ta o'quvchi</span>
  </div>

  <div class="table-wrap">

      <tbody id="tbody"></tbody>

  </div>

  <script>

      { n: 25, name: "Qodratullayev B", r: [null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null] },
      { n: 26, name: "Xolmirzoyeva K", r: [null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null] },
      { n: 27, name: "Yunusov Sh", r: [null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null] },
    ];

    function cell(v) {
      if (v === null || v === undefined) return `<span class="empty">–</span>`;
      return `<span class="num">${v}</span>`;
    }

    function render(data) {
      document.getElementById('tbody').innerHTML = data.map(s => `
    <tr>
      <td>${s.n}</td>
      <td>${s.name}</td>
      ${s.r.map(v => `<td>${cell(v)}</td>`).join('')}
    </tr>`).join('');
      document.getElementById('count').textContent = `${data.length} ta o'quvchi`;
    }

    let asc = true;
    function sortByName() {
      render([...students].sort((a, b) => asc ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name)));
      asc = !asc;
    }

    document.getElementById('search').addEventListener('input', e => {
      render(students.filter(s => s.name.toLowerCase().includes(e.target.value.toLowerCase())));
    });

    render(students);
  </script>
</body>

</html>
